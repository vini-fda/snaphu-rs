name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure auth for private git dependencies
        env:
          COST_SCALING_RS_PAT: ${{ secrets.COST_SCALING_RS_PAT }}
        run: |
          if [ -z "${COST_SCALING_RS_PAT}" ]; then
            echo "COST_SCALING_RS_PAT is not set. Cannot fetch private git dependency."
            exit 1
          fi
          git config --global url."https://x-access-token:${COST_SCALING_RS_PAT}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure auth for private git dependencies
        env:
          COST_SCALING_RS_PAT: ${{ secrets.COST_SCALING_RS_PAT }}
        run: |
          if [ -z "${COST_SCALING_RS_PAT}" ]; then
            echo "COST_SCALING_RS_PAT is not set. Cannot fetch private git dependency."
            exit 1
          fi
          git config --global url."https://x-access-token:${COST_SCALING_RS_PAT}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure auth for private git dependencies
        env:
          COST_SCALING_RS_PAT: ${{ secrets.COST_SCALING_RS_PAT }}
        run: |
          if [ -z "${COST_SCALING_RS_PAT}" ]; then
            echo "COST_SCALING_RS_PAT is not set. Cannot fetch private git dependency."
            exit 1
          fi
          git config --global url."https://x-access-token:${COST_SCALING_RS_PAT}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure auth for private git dependencies
        env:
          COST_SCALING_RS_PAT: ${{ secrets.COST_SCALING_RS_PAT }}
        run: |
          if [ -z "${COST_SCALING_RS_PAT}" ]; then
            echo "COST_SCALING_RS_PAT is not set. Cannot fetch private git dependency."
            exit 1
          fi
          git config --global url."https://x-access-token:${COST_SCALING_RS_PAT}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install C toolchain for reference binary
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: cargo test

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - name: Configure auth for private git dependencies
        env:
          COST_SCALING_RS_PAT: ${{ secrets.COST_SCALING_RS_PAT }}
        run: |
          if [ -z "${COST_SCALING_RS_PAT}" ]; then
            echo "COST_SCALING_RS_PAT is not set. Cannot fetch private git dependency."
            exit 1
          fi
          git config --global url."https://x-access-token:${COST_SCALING_RS_PAT}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps
